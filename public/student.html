<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - Placement Portal</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo"><span>🎓</span> <a href="/" style="color:white;text-decoration:none;">Placement Portal</a></div>
        <div class="nav-links" id="navLinks">
            <span class="user-badge" id="userBadge" style="display:none;"></span>
            <button onclick="logout()" id="logoutBtn" style="display:none;">Logout</button>
        </div>
    </nav>

    <!-- Auth Section (Login / Register) -->
    <div id="authSection">
        <div class="auth-container">
            <div class="card">
                <div class="tabs">
                    <button class="tab active" onclick="switchAuthTab('login')">Login</button>
                    <button class="tab" onclick="switchAuthTab('register')">Register</button>
                </div>

                <!-- Login Form -->
                <div class="tab-content active" id="loginTab">
                    <form onsubmit="login(event)">
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="loginEmail" placeholder="student@college.edu" required>
                        </div>
                        <div class="form-group">
                            <label>Password</label>
                            <input type="password" id="loginPassword" placeholder="Enter password" required>
                        </div>
                        <button type="submit" class="btn btn-primary" style="width:100%;">Login</button>
                    </form>
                </div>

                <!-- Register Form -->
                <div class="tab-content" id="registerTab">
                    <form onsubmit="register(event)">
                        <div class="form-row">
                            <div class="form-group">
                                <label>Full Name</label>
                                <input type="text" id="regName" placeholder="Saksham Baliyan" required>
                            </div>
                            <div class="form-group">
                                <label>Email</label>
                                <input type="email" id="regEmail" placeholder="student@college.edu" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Password</label>
                                <input type="password" id="regPassword" minlength="6" placeholder="Min 6 characters" required>
                            </div>
                            <div class="form-group">
                                <label>Roll Number</label>
                                <input type="text" id="regRoll" placeholder="21CSE001" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Branch</label>
                                <select id="regBranch" required>
                                    <option value="CSE">CSE</option>
                                    <option value="ECE">ECE</option>
                                    <option value="EEE">EEE</option>
                                    <option value="ME">ME</option>
                                    <option value="CE">CE</option>
                                    <option value="IT">IT</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Year</label>
                                <select id="regYear" required>
                                    <option value="1">1st Year</option>
                                    <option value="2">2nd Year</option>
                                    <option value="3" selected>3rd Year</option>
                                    <option value="4">4th Year</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>CGPA</label>
                                <input type="number" id="regCGPA" step="0.01" min="0" max="10" placeholder="8.5" required>
                            </div>
                            <div class="form-group">
                                <label>Active Backlogs</label>
                                <input type="number" id="regBacklogs" min="0" value="0">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Phone</label>
                            <input type="tel" id="regPhone" placeholder="9876543210">
                        </div>
                        <div class="form-group">
                            <label>Skills (comma separated)</label>
                            <input type="text" id="regSkills" placeholder="Java, Python, Web Development">
                        </div>
                        <button type="submit" class="btn btn-primary" style="width:100%;">Register</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Student Dashboard (shown after login) -->
    <div id="studentDashboard" style="display:none;">
        <div class="container">
            <div class="tabs">
                <button class="tab active" onclick="switchTab('drives')">🏢 Eligible Drives</button>
                <button class="tab" onclick="switchTab('applications')">📋 My Applications</button>
                <button class="tab" onclick="switchTab('profile')">👤 My Profile</button>
                <button class="tab" onclick="switchTab('notifications')">🔔 Notices</button>
            </div>

            <!-- Eligible Drives -->
            <div class="tab-content active" id="drivesTab">
                <h2 class="page-title">🏢 Eligible Placement Drives</h2>
                <div id="drivesList"></div>
            </div>

            <!-- My Applications -->
            <div class="tab-content" id="applicationsTab">
                <h2 class="page-title">📋 My Applications</h2>
                <div class="card">
                    <div class="table-wrap">
                        <table>
                            <thead>
                                <tr>
                                    <th>Company</th>
                                    <th>Role</th>
                                    <th>Package (LPA)</th>
                                    <th>Drive Date</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="applicationsTable"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Profile -->
            <div class="tab-content" id="profileTab">
                <h2 class="page-title">👤 My Profile</h2>
                <div class="card">
                    <form onsubmit="updateProfile(event)">
                        <div id="profileInfo"></div>
                        <div class="form-group">
                            <label>Phone</label>
                            <input type="tel" id="profilePhone">
                        </div>
                        <div class="form-group">
                            <label>Skills</label>
                            <input type="text" id="profileSkills" placeholder="Java, Python, React">
                        </div>
                        <div class="form-group">
                            <label>Resume Link (Google Drive / LinkedIn)</label>
                            <input type="url" id="profileResume" placeholder="https://drive.google.com/...">
                        </div>
                        <button type="submit" class="btn btn-primary">Update Profile</button>
                    </form>
                </div>
            </div>

            <!-- Notifications -->
            <div class="tab-content" id="notificationsTab">
                <h2 class="page-title">🔔 Notifications</h2>
                <div id="notificationsList"></div>
            </div>
        </div>
    </div>

    <script src="/js/student.js"></script>
</body>
</html>
